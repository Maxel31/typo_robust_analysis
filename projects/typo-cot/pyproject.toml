[project]
name = "typo-cot"
version = "0.1.0"
description = "Reproduction code for edited-word activation patching experiments"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "tqdm>=4.65",
]

[project.scripts]
typo-cot = "typo_cot.cli:main"

[project.optional-dependencies]
# Model generation, dataset loading, and AttnLRP attribution.
lrp = [
    "numpy>=2",
    "datasets>=4",
    "lxt==2.1",
    # Exact versions reported in Appendix A of the final paper.
    "transformers==4.57.6",
    "torch==2.10.0",
    "accelerate==1.12.0",
    "sentencepiece>=0.2.1",
    "protobuf>=4",
]

[dependency-groups]
dev = ["pytest>=8", "ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typo_cot"]
