[project]
name = "ucc-inj-reproduction"
version = "0.1.0"
description = "Reproducible hidden-state experiments for UCC-Inj"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4",
    "huggingface-hub>=0.36",
    "numpy>=2",
    "pyyaml>=6",
    "torch==2.10.0",
    "tqdm>=4.65",
    "transformers==4.57.6",
]

[project.scripts]
ucc-inj-reproduction = "ucc_inj_reproduction.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ucc_inj_reproduction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
