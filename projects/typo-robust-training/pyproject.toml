[project]
name = "typo-robust-training"
version = "0.1.0"
description = "Intervention-guided training for typo-robust language models"
requires-python = ">=3.12"
dependencies = [
    "accelerate==1.12.0",
    "datasets>=4",
    "huggingface-hub>=0.36,<1",
    "numpy>=2",
    "protobuf>=4",
    "sentencepiece>=0.2.1",
    "torch==2.10.0",
    "transformers==4.57.6",
    "typo-cot",
]

[project.entry-points."typo_cot.commands"]
robustness-training = "typo_robust_training.cli:register_commands"

[tool.uv.sources]
typo-cot = { path = "../typo-cot", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff==0.15.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typo_robust_training"]
