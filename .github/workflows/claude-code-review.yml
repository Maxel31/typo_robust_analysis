name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out trusted review tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .trusted-review
          persist-credentials: false

      - name: Prepare credential-free test sandbox
        env:
          REVIEW_SANDBOX_SENTINEL: must-not-enter-review-tests
        run: |
          sudo install -o root -g root -m 0755 \
            .trusted-review/.github/review/run-falsification-test.sh \
            /usr/local/bin/review-falsify
          rm -rf .trusted-review
          review-falsify --prepare \
            "${GITHUB_WORKSPACE}" \
            "${{ github.event.pull_request.base.sha }}"
          review-falsify --self-test

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Use a falsification-first review process for every suspected defect:
            - Create a minimal test that proves the feature is wrong, and run that test against the PR code.
            - Only report an issue as an actionable defect when the test fails for the claimed reason and the expected behavior is well-defined.
            - Include the reproducing test (or its exact patch), command, and observed failure in the review comment.
            - If you cannot produce such a counterexample after a reasonable attempt, do not claim that the feature is incorrect; at most record it as an explicitly unproven suggestion.
            - Create review-only test files under `/tmp/claude-review-tests`; they are local evidence only. Do not commit or push them.
            - Run a counterexample only through the credential-free sandbox. Use exactly one of:
              `review-falsify root /tmp/claude-review-tests/TEST.py`,
              `review-falsify typo-cot /tmp/claude-review-tests/TEST.py`, or
              `review-falsify typo-robust-training /tmp/claude-review-tests/TEST.py`.
              Direct `pytest` or `uv run` execution is forbidden because the review job has credentials.

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

            IMPORTANT: Write all review comments (summary and inline) in Japanese (日本語で記述してください).

          claude_args: |
            --model opus
            --allowedTools "Read,Grep,Glob,Write,Bash(review-falsify:*),Bash(git diff:*),Bash(git status:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
