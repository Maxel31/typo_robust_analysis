name: UCC-Inj adaptation tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ucc-inj-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install "numpy>=2,<3" "pytest>=8,<10" "PyYAML>=6,<7" "tqdm>=4.65,<5"
      - name: Run isolated unit tests
        env:
          PYTHONPATH: projects/ucc-inj-reproduction/src
        run: python -m pytest -q projects/ucc-inj-reproduction/tests
