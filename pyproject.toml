[project]
name = "typo-robust-analysis"
version = "0.0.0"
description = "Workspace for reproducing edited-word activation-patching experiments"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["projects/typo-cot"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.ruff]
line-length = 100
target-version = "py312"
